# Custom alacritty theme - Hackers Green
[terminal]
shell = "/run/current-system/sw/bin/zsh"

[window]
opacity = 0.95

[font]
size = 12.0

[font.bold]
family = "JetBrains Mono"
style = "Bold"

[font.bold_italic]
family = "JetBrains Mono"
style = "SemiBold Italic"

[font.italic]
family = "JetBrains Mono"
style = "Italic"

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[colors.primary]
background = '#000000'
foreground = '#11FF00'

[colors.cursor]
text = '#000000'
cursor = '#11FF00'

[colors.vi_mode_cursor]
text = '#000000'
cursor = '#ACF7D2'

[colors.selection]
text = '#000000'
background = '#11FF00'

[colors.search.matches]
foreground = '#000000'
background = '#ACF7D2'

[colors.search.focused_match]
foreground = '#000000'
background = '#11FF00'

[colors.footer_bar]
foreground = '#000000'
background = '#ACF7D2'

[colors.hints.start]
foreground = '#000000'
background = '#FFF19E'

[colors.hints.end]
foreground = '#000000'
background = '#ACF7D2'

[colors.normal]
black = '#1B1B1B'
red = '#FFB5B5'
green = '#ACF7D2'
yellow = '#FFF19E'
blue = '#94FF00'
magenta = '#CF7DFF'
cyan = '#48B9C7'
white = '#E2E2E2'

[colors.bright]
black = '#5E5E5E'
red = '#FFA090'
green = '#5EDB8C'
yellow = '#F7E062'
blue = '#94FF00'
magenta = '#CF7DFF'
cyan = '#48B9C7'
white = '#FFFFFF'
